        the report's live status. The response carries the absolute link, a title and one
        fixed line, and never a count; repeated calls answer the same link. A report that
        does not exist, is too old, or is not shown to the reader gets 404 and no link is
        made. Sharing is limited per signed in account, and a blocked call gets 429 with a
        Retry-After header. Requires a signed in session; otherwise 401.
