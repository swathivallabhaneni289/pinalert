    type: object
  handlers.UpdateWire:
    properties:
      available:
        description: |-
          Available is false when the report was held, removed or has gone since the
          update was made.
        example: true
        type: boolean
      category:
        description: Category is the page's own category word, empty when unavailable.
        example: Flood
        type: string
      created_at:
        description: CreatedAt is when the update was written.
        type: string
      event:
        description: 'Event is line 1: the event words, built on the server.'
        example: Now confirmed
        type: string
      id:
        description: ID orders the list and is what the read mark sends back as up_to.
        example: 41
        type: integer
      kind:
        description: Kind is the closed kind of the row.
        enum:
        - reached_live
        - hidden
        - resolved
        - fading
        - reliable_nearby
        - comment_on_yours
        - reply_to_yours
        - followed_posted
        - more
        example: reached_live
        type: string
      label:
        description: Label is the row's accessible name, built whole on the server
          (UI-SPEC P32-C8).
        example: New. Now confirmed. Flood, Critical. Confirmed by 3 people at different
          spots. 12 minutes ago
        type: string
      more_count:
        description: |-
          MoreCount is how many changes the rolled up row stands for. Only that row
          carries it.
        example: 4
        type: integer
      report_id:
        description: |-
          ReportID is the report the row opens. It is absent for the rolled up row
          and for a report that is no longer available, so a row never links to a
          report the reader may not open.
        example: 17
        type: integer
      report_line:
        description: |-
          ReportLine is the first line of the report's text (Q1 owner confirmed
          2026-10-18). It is absent for a finished Rescue report, an unavailable
          report and the rolled up row. It is never the whole description.
        example: Water over the bridge
        type: string
      severity:
        description: Severity is the severity word, empty when unavailable.
        example: Critical
        type: string
      severity_level:
        description: SeverityLevel is the raw closed value for the severity dot colour.
        enum:
        - low
        - medium
        - critical
        - ''''''
        example: critical
        type: string
      trust:
        description: Trust is the trust sentence for the report now, chosen when the
          list is read.
        example: Confirmed by 3 people at different spots.
        type: string
      unread:
        description: Unread is true until the reader marks the row read.
        example: true
        type: boolean
      when:
        description: When is how long ago, in the app's short words.
        example: 12 min ago
        type: string
    type: object
  handlers.UpdatesResponse:
    properties:
      unread:
        example: 3
        type: integer
      updates:
        items:
          $ref: '#/definitions/handlers.UpdateWire'
        type: array
    type: object
  handlers.UsernameCheckResponse:
    properties:
      days:
        example: 7
        type: integer
      message:
        example: asha_k is available.
        type: string
      state:
        enum:
        - available
        - yours
        - taken
        - invalid
        - reserved
        - wait
        example: available
        type: string
    type: object
  handlers.VisibilityRequest:
    properties:
      profile_public:
        example: true
        type: boolean
    type: object
  handlers.VisibilityResponse:
    properties:
      profile_public:
        example: true
        type: boolean
    type: object
  handlers.emptyBody:
    type: object
info:
  contact:
    name: Pinalert project
    url: https://github.com/swathivallabhaneni289/pinalert
  description: |-
    Crowd-reported local emergency feed for floods, cyclones, and other disasters.
    Reports are posted by nearby people and confirmed or disputed by other nearby
    people; this API is the read/write surface for that data. Reading and writing
    reports both require a signed in session, an account signed in with an email
    and a password, and a session that is not signed in is refused with 401. Pinalert is an unofficial,
    unaffiliated project and is not a substitute for contacting emergency services.
    This document is Swagger 2.0 — swag (the generator behind this spec) does not
    emit OpenAPI 3.x, so tooling that expects OpenAPI 3.x specifically should account
    for that; OPS-01's "OpenAPI/Swagger spec" requirement is satisfied by either
    format.
  license:
    name: Unlicensed (all rights reserved)
  title: Pinalert API
  version: "1.0"
paths:
  /auth/code/resend:
    post:
      consumes:
      - application/json
      description: |-
        Sends a new code for the code screen this browser is showing, under the same
        per address limits. The body is an empty object. The answer is the same for every
        address.
      parameters:
      - description: Empty object
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResendRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CodeSentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Send the code again
      tags:
      - auth
  /auth/reset:
    post:
      consumes:
      - application/json
      description: |-
        Emails a 6 digit code to an address that has an account, and a short note to an
        address that has none. The answer is the same for every address, so it never says
        whether an account exists.
      parameters:
      - description: Email
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CodeSentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Ask for a password reset code
      tags:
      - auth
  /auth/reset/code:
    post:
      consumes:
      - application/json
      description: |-
        Checks the 6 digit code and the new password. A right code sets the password and
        ends every session of the account. It does not sign this browser in.
      parameters:
      - description: The typed code and the new password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.ResetCodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PasswordSetResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Set a new password with the reset code
      tags:
      - auth
  /auth/sign-in:
    post:
      consumes:
      - application/json
      description: |-
        Checks the email and the password. A wrong email, a wrong password and an account
        without a password all get the same answer. A good sign in puts this browser on a
        new session and names the page to go to next. The response never carries a session
        identifier.
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SignInRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SignedInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Sign in with an email and a password
      tags:
      - auth
  /auth/sign-up:
    post:
      consumes:
      - application/json
      description: |-
        Checks the email and the password, then emails a 6 digit code to type on the next
        screen. The answer is the same for every address, so it never says whether an
        account already exists. The password is held only as a hash until the code is
        confirmed. The response never carries a session identifier.
      parameters:
      - description: Email and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SignUpRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CodeSentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Create an account with an email and a password
      tags:
      - auth
  /auth/sign-up/code:
    post:
      consumes:
      - application/json
      description: |-
        Checks the 6 digit code typed by the person. A right code creates the account, sets
        the password typed at Create account and signs this browser in. The response names
        the page to go to next and never carries a session identifier.
      parameters:
      - description: The typed code
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CodeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.SignedInResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Confirm the code of a new account
      tags:
      - auth
  /comments/{id}/delete:
    post:
      description: |-
        Deletes the caller's own comment, at any time and whatever the state of the report.
        There is no edit. A comment that has visible replies stays as a placeholder with no
        words. Deleting a comment that is already deleted answers 200 again. Someone else's
        comment gets 403, and an unknown comment gets 404. Deleting is limited with likes,
        and a blocked delete gets 429 with a Retry-After header.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Comment id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.DeleteCommentResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: The comment belongs to someone else
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Delete your own comment
      tags:
      - comments
  /comments/{id}/flag:
    post:
      consumes:
      - application/json
      description: |-
        Sends a comment to the moderators with one or more of five reasons: spam, abusive,
        false, dangerous or other, each at most once, and an optional note of at most 300
        characters that only moderators see. The note goes through the same text check as a
        report flag note, and a refused note gets 422. A flag never hides or changes the
        comment. Each account can flag a comment once, and a repeat gets 409; your own
        comment also gets 409. Flagging stays open after the comments close. It shares the
        report flag limit, and a blocked flag gets 429 with a Retry-After header.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Comment id
        in: path
        name: id
        required: true
        type: integer
      - description: One or more of the five reasons and an optional note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.FlagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.FlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Your own comment, or already flagged by you
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: The note was refused by the text check
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Flag a comment for the moderators
      tags:
      - comments
  /comments/{id}/like:
    post:
      description: |-
        Adds the caller's like to a comment and answers the fresh count. One like counts per
        account, so a repeat changes nothing. A like never changes any trust number. Likes
        are closed with the comments (409, field comments); a comment that is deleted,
        removed or held back, or on a report that is not available, gets 404. Liking is
        limited per verified account, and a blocked like gets 429 with a Retry-After header.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Comment id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LikeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Comments are closed
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Like a comment
      tags:
      - comments
  /comments/{id}/unlike:
    post:
      description: |-
        Removes the caller's like from a comment and answers the fresh count. Taking back a
        like that was never given changes nothing. The same closed, gone and limit answers
        as a like apply.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Comment id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.LikeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Comments are closed
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Take back a like on a comment
      tags:
      - comments
  /geocode:
    get:
      description: |-
        Searches Photon first, which matches close spellings and half typed words, and
        returns at most five matches, in India only. Requires a signed in session (an account signed in
        with an email and a password); a session that is not signed in is refused with 401. The optional lat and lon (both or neither, the report
        pin) make Photon prefer nearby places. With lat and lon, only places within 50 km of the pin are
        returned, and a city or town named as typed; a search that finds only farther places
        returns an empty list, and a shorter text of one word is not tried. Without them the search covers all
        of India. When Photon finds nothing the search asks
        Nominatim with the whole text, preferring places near the pin, then Photon again
        without the first part and then without the second; matched_query then holds the
        shorter text that matched. A first Photon request that takes over 2 seconds is
        sent once more, with 2.5 seconds. When Photon fails, or is too slow both times,
        Nominatim alone runs those tries, in a box around the pin first. At most four upstream requests are
        sent per search. Each verified account has its own budget of 8 searches at once,
        then 1 a second; past it the answer is a 429. A
        503 means search is temporarily unavailable; report submission remains fully
        usable regardless.
      parameters:
      - description: Place or address text, 3 to 200 characters
        in: query
        name: q
        required: true
        type: string
      - description: Report pin latitude, -90 to 90, sent together with lon
        in: query
        name: lat
        type: number
      - description: Report pin longitude, -180 to 180, sent together with lat
        in: query
        name: lon
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GeocodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Search for a place or address by free-text query
      tags:
      - geocode
  /geocode/place:
    get:
      description: |-
        Place search for the history views. It runs on its own lane of the geocoder: it
        never queues ahead of a report search, repeated searches are answered from a cache, and each
        verified account has its own budget of 8 searches at once, then 1 a second. Results are in India only. It asks
        Photon first, which matches close spellings and half typed words; the optional
        lat and lon (both or neither, the map centre) make Photon prefer nearby places. With lat and lon,
        only places within 50 km of the map centre are returned, and a city or town named as typed; a
        search that finds only farther places returns an empty list, except with kind=area, which is never
        cut by distance; with them a shorter text of one word is not tried. Without them the search covers all
        of India. When
        Photon finds nothing it asks Nominatim with the whole text, preferring places near
        the map centre, then Photon again without the first part and then without the
        second; matched_query then holds the shorter text that matched. A first Photon
        request that takes over 2 seconds is sent once more, with 2.5 seconds. When Photon
        fails, or is too slow both times, Nominatim alone runs those tries, in a box around
        the map centre first. At most four upstream requests are sent per search.
        With kind=area the text is sent without a trailing PIN code, state name or country, and when no area in the
        town the person typed (the second comma separated part) closely matches the first part, the answer starts with
        one extra row marked typed true, the typed text placed in that town; its lookups count inside the same cap of
        four upstream requests. A first part with a digit or a street word never gets that row.
        With kind=area the town may also follow the neighbourhood without a comma (the last one or two words are tried as the
        town), or be named by a six digit PIN code in the text when no town is found; those lookups count inside the same cap.
        no_match is true when no row closely matches what was typed, no typed row could be placed, and every lookup the search needed answered; the page asks for the town.
        unfinished is true instead when a lookup that was needed failed or timed out, so Not found is not claimed; the lookups fall back to Nominatim inside the same cap.
        A 429 or 503 never affects report submission, which has its own search.
      parameters:
      - description: Place text, 3 to 200 characters
        in: query
        name: q
        required: true
        type: string
      - description: Map centre latitude, -90 to 90, sent together with lon
        in: query
        name: lat
        type: number
      - description: Map centre longitude, -180 to 180, sent together with lat
        in: query
        name: lon
        type: number
      - description: Send area to get areas only (neighbourhoods, localities, towns,
          cities, districts), never a street or a building. Left out, every kind of
          place is returned
        enum:
        - area
        in: query
        name: kind
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PlaceResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Search for a place on the reader lane
      tags:
      - geocode
  /me/alerts:
    patch:
      consumes:
      - application/json
      description: |-
        Saves whether the signed in account wants an update when a Reliable reporter posts
        near its home area, and how far away that may be: 1, 2, 5 or 10 km. A key left out
        keeps what is stored. The alert is off until turned on and the distance is 5 km until
        changed. The distance is measured from the middle of the saved home area, which is a
        cell about 5 km across; no position is ever sent or stored for this. Turning the
        alert on without a home area is refused with the field reliable_alerts, and removing
        the home area turns the alert off. Only reports posted after the alert was turned on
        can raise it.
        Two more keys control the phone notifications: critical_push (Critical reports near the
        home area, on until turned off, even for an account that never saved a choice) and
        changes_push (changes to reports the account posted or voted on, off until turned on).
        Turning critical_push on without a home area is refused with the field critical_push;
        changes_push needs no home area, and turning either off never does. Removing the home
        area keeps the stored critical_push value. No position is ever sent.
        A fifth key, official_push, is the switch for Severe official alerts for the home area
        (on until turned off, even for an account that never saved a choice). Turning
        official_push on without a home area is refused with the field official_push; turning it
        off never needs one, and removing the home area keeps the stored value. The answer is all
        the settings as stored.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The settings to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.AlertSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.AlertSettingsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Turn the Reliable reporter alert on or off and choose its distance
      tags:
      - me
  /me/blocked:
    get:
      description: |-
        Returns the usernames of the people the signed in account blocked, newest first, at most
        500. A person whose new username is still being checked is left out until it clears.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.BlockedPeopleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List the people the caller blocked
      tags:
      - people
  /me/consent:
    post:
      consumes:
      - application/json
      description: |-
        Records that the signed in account agreed to the current version of the Disclaimer
        and Policy text. Send no body or an empty object. A repeat call for the same version
        keeps the first agreed time. A different version is stored with a new time.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "204":
          description: Agreed
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Agree to the current terms
      tags:
      - me
  /me/delete:
    post:
      consumes:
      - application/json
      description: |-
        Deletes the signed in account. The sign in address is replaced by one that can never
        receive mail, the name, home area and consent are cleared, and every session of the
        account ends, this one included. The updates, muted reports, alert settings and
        sign in links of the account are deleted. The reports and votes the person made stay,
        with no name or link to the person, so every count other people see is unchanged. The
        same address can sign up again as a brand new account with no history. The body must
        say confirm true; anything else deletes nothing.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Must carry confirm true
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.DeleteAccountRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Deleted
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Delete my account
      tags:
      - me
  /me/first-run-done:
    post:
      consumes:
      - application/json
      description: |-
        Records that the signed in account finished the first-time flow. It needs the current
        terms to be agreed first: without that it answers 409 with the field terms. It also
        needs the username, the name and the home area to be saved (step 4 of the flow is
        required): without them it answers 409 with the field profile. Send no body or an
        empty object. A repeat call keeps the first time.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "204":
          description: Done
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Mark the first-time flow as finished
      tags:
      - me
  /me/followers/remove-all:
    post:
      consumes:
      - application/json
      description: |-
        Ends every follow of the signed in account at once. Send no body or an empty object. It
        answers 204 even when nobody follows the account.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "204":
          description: All followers removed
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Remove every follower
      tags:
      - people
  /me/logout-all:
    post:
      consumes:
      - application/json
      description: |-
        Ends the signed in account's sessions on every device, including this one. Reports and
        votes keep their author, so nothing other people see changes. Send no body or an empty
        object. Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: No fields
        in: body
        name: body
        schema:
          $ref: '#/definitions/handlers.emptyBody'
      produces:
      - application/json
      responses:
        "204":
          description: Logged out everywhere
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Log out of all devices
      tags:
      - me
  /me/muted-people:
    get:
      description: |-
        Returns the usernames of the people the signed in account muted, newest first, at most
        500. A person whose new username is still being checked is left out until it clears.
        Only the caller reads this list.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MutedPeopleResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List the people the caller muted
      tags:
      - people
  /me/muted-reports:
    get:
      description: |-
        Lists the signed in account's muted reports, newest mute first, for the Muted reports
        window of Settings. A report that is held, removed or has gone shows available false
        with no text, category or severity, and still carries report_id so the mute can be
        undone. A finished Rescue report shows no text. The answer is never cached.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.MutedReportsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List the reports you muted
      tags:
      - me
  /me/profile:
    patch:
      consumes:
      - application/json
      description: |-
        Updates the username, the name and the home area of the signed in account. A key left
        out changes nothing. The name and the home area can be changed but not emptied: an
        empty display_name and a null home_area are refused with 400. A home_area object saves
        the picked place. The home area keeps only the place name and a cell about 5 km across;
        the coordinates you send are used once to find the cell and are never stored. The answer
        is the profile as stored, with no coordinates.
        The username is 3 to 20 letters, numbers, dots or underscores, unique, and can be changed
        once every 7 days. Each refusal has one fixed status. 400 with the field username: the
        name is taken, has the wrong characters, is kept for official use, or is changed too
        soon. 422 with the field username: the text screening refused the name; this is the only
        422. 429 with the field username and a Retry-After header: the account spent its save
        allowance (5, then one every 10 seconds).
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The rows to change
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.UpdateProfileRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ProfileResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Save the username, name and home area
      tags:
      - me
  /me/push/status:
    post:
      consumes:
      - application/json
      description: |-
        Answers whether the signed in account has this endpoint registered. The endpoint is
        sent only in the body, because it is a secret address; it is compared and never
        returned or logged. The body is application/json of at most 4 KB. Each account may ask
        10 times at once and then once every 6 seconds; past that the answer is 429.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The device's endpoint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PushEndpointRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PushStatusResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Ask whether this device is registered for phone alerts
      tags:
      - me
  /me/push/subscription:
    post:
      consumes:
      - application/json
      description: |-
        Stores the browser's push subscription for the signed in account and the calling
        session. The endpoint must be on a known push service and the keys must have the
        right shape, otherwise the answer is 400 with the field endpoint or keys. An endpoint
        already held by another account moves to this one, so a shared phone never keeps the
        previous person's alerts. An account keeps at most 8 devices; the oldest is dropped.
        The endpoint is sent only in the body and is never returned or logged. Answers 503
        when the server has no push key. The body is application/json of at most 4 KB. Each
        account may register 5 devices at once and then one a minute; past that the answer is
        429. Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The browser's PushSubscription
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PushSubscriptionRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Registered
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Register this device for phone alerts
      tags:
      - me
  /me/push/unsubscribe:
    post:
      consumes:
      - application/json
      description: |-
        Removes this endpoint for the signed in account only; an endpoint that belongs to
        another account, or to nobody, changes nothing and still answers 204. The endpoint is
        sent only in the body and is never returned or logged. The body is application/json of
        at most 4 KB. Each account may remove 5 devices at once and then one a minute; past
        that the answer is 429. Requires a session verified by email; an unverified caller
        receives 401.
      parameters:
      - description: The device's endpoint
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.PushEndpointRequest'
      produces:
      - application/json
      responses:
        "204":
          description: Removed
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "413":
          description: Request Entity Too Large
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "415":
          description: Unsupported Media Type
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Remove this device from phone alerts
      tags:
      - me
  /me/visibility:
    patch:
      consumes:
      - application/json
      description: |-
        Saves whether the signed in account has a public profile that others can follow. Turning
        it on needs a clear username and a name that can be shown in public; a username or name
        that is refused, or that could not be checked just now, answers 422 with the field
        profile_public and the reason, and the switch stays off. Turning it off ends every
        follower, and turning it on later starts with none. The answer is the saved state.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The switch
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.VisibilityRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.VisibilityResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Turn Let others follow me on or off
      tags:
      - people
  /official/alerts:
    get:
      description: |-
        Returns the official alerts (NDMA SACHET) that cover the reader and whether that answer can be trusted right now.
        The optional lat and lon (both or neither) are the position Nearby is using. The server turns them into a
        district at once and keeps no reader location: it is neither stored nor logged. The home area saved on the
        account is read in the same way and is never returned.
        The server authors every fact in the answer: state (fresh within 30 minutes of the last good check, stale up to
        6 hours, unavailable after that or never), age_seconds from the server clock, the group labels, the row count,
        the districts line, each row's level, authority badge, issuer and times, and the banner pick. The page recomputes none of it.
        Groups come in this order: where the reader is, the home area when it is another district, state level alerts
        for the state, and alerts that could not be placed. Within a group the order is Extreme, Severe, Moderate, Minor,
        Unknown, newest first. Near identical alerts are one row with grouped_count.
        When the state is stale, rows still inside their own expiry are sent as the last known ones and banner is null.
        When it is unavailable no rows are sent. Only a fresh answer with area_known true and no rows may be read as
        "no official alerts in force".
        A read also starts a background refresh of the feed when the last attempt is over 10 minutes old; it never delays the answer.
      parameters:
      - description: Reader latitude, -90 to 90, sent together with lon
        in: query
        name: lat
        type: number
      - description: Reader longitude, -180 to 180, sent together with lat
        in: query
        name: lon
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OfficialAlertsResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Official alerts for the reader's area
      tags:
      - official
  /official/pins:
    get:
      description: |-
        Returns the current GDACS (Global Disaster Alert and Coordination System) hazard events for the map layer: cyclones, floods, earthquakes, volcanoes and wildfires, each with its hazard word, its Red, Orange or Green level word, its point, its dates and GDACS's severity text.
        A pin is an automatic estimate from GDACS, not an official warning and not a Pinalert report: it has no votes and no reliability tag, and it is never counted as a report. Follow your state disaster management authority.
        Current means GDACS marks the event current and it ended no more than 2 days ago. state is the GDACS feed's own freshness (fresh within 30 minutes of the last good check, stale up to 6 hours, unavailable after that or never). Unless the state is fresh, pins is empty: an old hazard is never drawn as current.
        report_url is a GDACS page link and is empty unless it starts with https://www.gdacs.org/. All text is GDACS text and must be drawn with textContent only.
        A read also starts a background refresh of the feeds that are due; it never delays the answer.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.OfficialPinsResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: GDACS hazard pins for the map
      tags:
      - official
  /people/{username}:
    get:
      description: |-
        Returns the profile header of the person with this username: name, home area, stars,
        the reporter tag, the member since line and the two counts, every string written by the
        server. A person who has not turned on a public profile, one whose username is still
        being checked, one who has deleted the account and one who blocked the caller all get
        the same 404 as a username that does not exist, so nobody can tell who opted in. A person
        the caller blocked returns only the username with blocked_by_you true. Your own profile
        always opens. The counts include people who are shown only as a number.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PersonProfileResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Read a person's profile
      tags:
      - people
  /people/{username}/block:
    post:
      consumes:
      - application/json
      description: |-
        Blocks a person. Every follow between the two of you ends and neither can follow the
        other. The blocked person gets the same 404 as an unknown username on your profile. Send
        no body or an empty object. A person you may not see answers the same 404 as the profile.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Blocked
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Block a person
      tags:
      - people
  /people/{username}/follow:
    post:
      consumes:
      - application/json
      description: |-
        Starts following a person who turned on a public profile and holds the Reliable reporter
        tag. Send no body or an empty object. Following someone already followed changes nothing
        and answers 204. A person you cannot follow right now (yourself, someone you blocked, or
        someone who is not a Reliable reporter) answers 409 with the field follow; so does the
        limit of 200 people. A person you may not see answers the same 404 as the profile.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      produces:
      - application/json
      responses:
        "204":
          description: Following
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Follow a person
      tags:
      - people
  /people/{username}/followers:
    get:
      description: |-
        Returns the named people who follow this person, newest first, 50 per page. People who
        are not named (private, pending, deleted or blocked) are counted in others_count with
        the sentence others_text. Pass the next value as after to read the next page. The same
        404 as the profile is returned for a person the caller may not see.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Cursor from the previous page
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PeopleListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List the people who follow a person
      tags:
      - people
  /people/{username}/following:
    get:
      description: |-
        Returns the named people this person follows, newest first, 50 per page, with the same
        rules as the Followers list.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Username
        in: path
        name: username
        required: true
        type: string
      - description: Cursor from the previous page
        in: query
        name: after
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.PeopleListResponse'
        "400":
          description: Bad Request
