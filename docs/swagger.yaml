  /username/check:
    get:
      description: |-
        Says whether a username can be saved by the signed in account: available, yours
        (it already is the account's name), taken (another account holds it), invalid (not
        3 to 20 letters, numbers, dots or underscores), reserved (kept for official use) or
        wait (the name was changed less than 7 days ago; days says how many days are left).
        The check judges the format, the reserved words and whether another account holds
        the name. It does not call the text screening: that runs once, when the name is saved,
        so a name that reads available can still be refused with 422 on save. Each account
        may check 10 times, then once a second; past that the answer is 429 with Retry-After.
        The answer is never cached.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The username to check, with or without a leading @
        in: query
        name: u
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UsernameCheckResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Check a username while typing
      tags:
      - me
