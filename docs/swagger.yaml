basePath: /api
definitions:
  handlers.CastVoteRequest:
    properties:
      latitude:
        description: Latitude must be between -90 and 90.
        example: 13.0827
        type: number
      longitude:
        description: Longitude must be between -180 and 180.
        example: 80.2707
        type: number
    type: object
  handlers.CastVoteResponse:
    properties:
      reason:
        enum:
        - resolved
        - critical_bypasses_gates
        - disputed
        - awaiting_second_independent_confirmation
        - confirmed
        example: confirmed
        type: string
      visibility:
        enum:
        - hidden
        - provisional
        - live
        - retracted
        example: live
        type: string
    type: object
  handlers.ErrorDetail:
    properties:
      field:
        example: category
        type: string
      message:
        example: Choose a category to continue.
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handlers.ErrorDetail'
    type: object
  handlers.FeedReportResponse:
    properties:
      category:
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - rescue_needed
        - other
        example: flood
        type: string
      created_at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      description:
        example: Water rising fast near the market bridge.
        type: string
      distance_km:
        example: 1.42
        type: number
      expires_at:
        example: "2026-09-06T14:03:00.000Z"
        type: string
      geohash:
        example: tdr1qgzp
        type: string
      id:
        example: 42
        type: integer
      is_own_report:
        description: |-
          IsOwnReport is true when the calling account submitted this report.
          02-05 omits the confirm/dispute controls when true (D-03) rather than
          rendering a button that will 403 — a convenience for the client,
          never the control: service.VotingService.CastVote refuses the
          self-vote server-side and 02-03b returns 403 for it regardless of
          what the client renders. Derived from a reporter account id the
          server looks up and never serialises: this response carries a
          boolean, never an account id or an email (T-01-02).
        example: false
        type: boolean
      latitude:
        example: 13.0827
        type: number
      longitude:
        example: 80.2707
        type: number
      severity:
        enum:
        - low
        - medium
        - critical
        example: critical
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is present only for shelter_open reports.
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        example: 42
        type: integer
      visibility:
        description: |-
          Visibility is the resolver's own answer, serialised verbatim from
          service.ReportView.Visibility; the client renders it and never
          recomputes it (TRUST-02, T-02-04). "retracted" is in the declared
          enum — it is one of the four values of the shared type — but can
          never actually appear here: D-12 removes retracted reports from both
          the default and the show_disputed view.
        enum:
        - hidden
        - provisional
        - live
        - retracted
        example: live
        type: string
      visibility_reason:
        description: |-
          VisibilityReason is the resolver's own explanation for Visibility
          above, from the SAME closed slug set votes.go's CastVoteResponse.Reason
          declares, so 02-06's display-copy mapping has one contract to key off
          regardless of which endpoint delivered it.
        enum:
        - resolved
        - critical_bypasses_gates
        - disputed
        - awaiting_second_independent_confirmation
        - confirmed
        example: confirmed
        type: string
      your_vote:
        description: |-
          YourVote is the calling account's own current content vote on this
          report — confirm, dispute, or null. Deliberately without omitempty,
          so the key is always present and explicitly null when the caller has
          no standing content vote. It is viewer-specific, which makes this
          response uncacheable across callers.
        enum:
        - confirm
        - dispute
        example: confirm
        type: string
    type: object
  handlers.ReportListResponse:
    properties:
      reports:
        items:
          $ref: '#/definitions/handlers.FeedReportResponse'
        type: array
    type: object
  handlers.ReportResponse:
    properties:
      category:
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - rescue_needed
        - other
        example: flood
        type: string
      created_at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      description:
        example: Water rising fast near the market bridge.
        type: string
      distance_km:
        description: DistanceKm is present only in GET /api/reports responses (nil
          on the report just submitted).
        example: 1.42
        type: number
      expires_at:
        example: "2026-09-06T14:03:00.000Z"
        type: string
      geohash:
        example: tdr1qgzp
        type: string
      id:
        example: 42
        type: integer
      latitude:
        example: 13.0827
        type: number
      longitude:
        example: 80.2707
        type: number
      severity:
        enum:
        - low
        - medium
        - critical
        example: critical
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is present only for shelter_open reports.
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        example: 42
        type: integer
    type: object
  handlers.RequestLinkRequest:
    properties:
      email:
        description: |-
          Email is the address to verify. Server-side validation (RFC 5322
          address parsing, no display-name form) happens in
          service.AuthService.RequestLink — never trust client-side validation.
        example: visitor@example.com
        type: string
    type: object
  handlers.RequestLinkResponse:
    properties:
      email:
        example: visitor@example.com
        type: string
    type: object
  handlers.SubmitReportRequest:
    properties:
      category:
        description: Category is one of the nine canonical report categories (internal/service.Categories).
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - rescue_needed
        - other
        example: flood
        type: string
      description:
        description: Description is a free-text account of the report, 10-1000 characters.
        example: Water rising fast near the market bridge.
        type: string
      latitude:
        description: Latitude must be between -90 and 90.
        example: 13.0827
        type: number
      longitude:
        description: Longitude must be between -180 and 180.
        example: 80.2707
        type: number
      severity:
        description: Severity affects triage ordering only; self-declaring critical
          never bypasses the provisional-visibility gate (internal/service.Severities).
        enum:
        - low
        - medium
        - critical
        example: medium
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is required when category is shelter_open
          and forbidden for every other category (internal/service.CapacityStatuses).
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        description: ShelterHeadcount is optional and only valid alongside category
          shelter_open.
        example: 42
        type: integer
    type: object
  handlers.SubmitReportResponse:
    properties:
      report:
        $ref: '#/definitions/handlers.ReportResponse'
    type: object
info:
  contact:
    name: Pinalert project
    url: https://github.com/swathivallabhaneni289/pinalert
  description: |-
    Crowd-reported local emergency feed for floods, cyclones, and other disasters.
    Reports are posted by nearby people and confirmed or disputed by other nearby
    people; this API is the read/write surface for that data. Reading and writing
    reports both require a session verified by email through the magic-link flow —
    an unverified caller is refused with 401. Pinalert is an unofficial,
    unaffiliated project and is not a substitute for contacting emergency services.
    This document is Swagger 2.0 — swag (the generator behind this spec) does not
    emit OpenAPI 3.x, so tooling that expects OpenAPI 3.x specifically should account
    for that; OPS-01's "OpenAPI/Swagger spec" requirement is satisfied by either
    format.
  license:
    name: Unlicensed (portfolio project, all rights reserved)
  title: Pinalert API
  version: "1.0"
paths:
  /auth/request-link:
    post:
      consumes:
      - application/json
      description: |-
        Validates the given email address, mints a single-use 5-minute magic-link
        token, persists its hash, and hands the raw link to the configured mailer.
        The response never carries a session identifier.
      parameters:
      - description: Email to verify
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RequestLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RequestLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Request a magic-link verification email
      tags:
      - auth
  /reports:
    get:
      description: |-
        Runs the indexed bounding-box prefilter followed by exact Haversine distance,
        then resolves each report's visibility fresh via the shared resolver and returns
        only listable ones, nearest first. This single endpoint serves both the map and the
        list views — there is no separate map-only route. A resolved (retracted) report is
        never returned by either view. show_disputed=true additionally includes reports
        currently hidden by disputes, in the list and among the map pins together. Every
        report carries your_vote and is_own_report relative to the calling verified account.
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401 and no report data.
      parameters:
      - description: Latitude of the query center (required, -90 to 90)
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude of the query center (required, -180 to 180)
        in: query
        name: lon
        required: true
        type: number
      - default: 10
        description: Search radius in kilometers (defaults to 10, bounded to 0.1-50)
        in: query
        maximum: 50
        minimum: 0.1
        name: radius_km
        type: number
      - description: Include reports hidden by disputes (defaults to false)
        in: query
        name: show_disputed
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReportListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: List unexpired, currently-visible reports near a point
      tags:
      - reports
    post:
      consumes:
      - application/json
      description: |-
        Creates a location-tagged report under the caller's session. Requires a session
        verified by email through the magic-link flow (POST /auth/request-link, then
        GET /auth/verify) — an unverified caller receives 401. id, geohash, created_at
        and expires_at are computed server-side and can never be set by the client.
      parameters:
      - description: Report to submit
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SubmitReportRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SubmitReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Submit a new emergency report
      tags:
      - reports
  /reports/{id}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Casts one of four votes against a report: confirm/dispute are content votes (is
        this report still true), resolve/reopen are resolution votes (is this resolved).
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401. The reporter receives 403 on confirm/dispute but may resolve
        or reopen their own report instantly. The response carries the freshly recomputed
        visibility and reason so the client can render the outcome without guessing.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: Voter's current coordinates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CastVoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CastVoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Cast a confirm, dispute, resolve, or reopen vote on a report
      tags:
      - reports
  /reports/{id}/dispute:
    post:
      consumes:
      - application/json
      description: |-
        Casts one of four votes against a report: confirm/dispute are content votes (is
        this report still true), resolve/reopen are resolution votes (is this resolved).
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401. The reporter receives 403 on confirm/dispute but may resolve
        or reopen their own report instantly. The response carries the freshly recomputed
        visibility and reason so the client can render the outcome without guessing.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: Voter's current coordinates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CastVoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CastVoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Cast a confirm, dispute, resolve, or reopen vote on a report
      tags:
      - reports
  /reports/{id}/reopen:
    post:
      consumes:
      - application/json
      description: |-
        Casts one of four votes against a report: confirm/dispute are content votes (is
        this report still true), resolve/reopen are resolution votes (is this resolved).
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401. The reporter receives 403 on confirm/dispute but may resolve
        or reopen their own report instantly. The response carries the freshly recomputed
        visibility and reason so the client can render the outcome without guessing.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: Voter's current coordinates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CastVoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CastVoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Cast a confirm, dispute, resolve, or reopen vote on a report
      tags:
      - reports
  /reports/{id}/resolve:
    post:
      consumes:
      - application/json
      description: |-
        Casts one of four votes against a report: confirm/dispute are content votes (is
        this report still true), resolve/reopen are resolution votes (is this resolved).
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401. The reporter receives 403 on confirm/dispute but may resolve
        or reopen their own report instantly. The response carries the freshly recomputed
        visibility and reason so the client can render the outcome without guessing.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: Voter's current coordinates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CastVoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CastVoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
