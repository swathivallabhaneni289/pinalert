basePath: /api
definitions:
  handlers.CastVoteRequest:
    properties:
      latitude:
        description: Latitude must be between -90 and 90. Required, except on the
          reporter's own resolve and reopen and on the take back.
        example: 13.0827
        type: number
      longitude:
        description: Longitude must be between -180 and 180. Required, except on the
          reporter's own resolve and reopen and on the take back.
        example: 80.2707
        type: number
    type: object
  handlers.CastVoteResponse:
    properties:
      reason:
        enum:
        - resolved
        - critical_bypasses_gates
        - disputed
        - awaiting_second_independent_confirmation
        - confirmed
        example: confirmed
        type: string
      trust:
        allOf:
        - $ref: '#/definitions/handlers.TrustResponse'
        description: |-
          Trust is the server built trust object for this report, the same value
          the feed returns (D-21). It is present on every successful vote.
      undos_left:
        description: |-
          UndosLeft is how many take backs the caller has left on this report after
          this vote (D-22). It is present on resolve, reopen and unresolve
          responses only, and absent on confirm and dispute, which have no undo
          budget. The browser decides the short Undo after Yes, mark resolved from
          this number before the list refetch lands.
        example: 2
        type: integer
      visibility:
        enum:
        - hidden
        - provisional
        - live
        - retracted
        example: live
        type: string
    type: object
  handlers.CurrencyResponse:
    properties:
      band:
        description: Band is the still current band, written by the server.
        enum:
        - up_to_date
        - getting_old
        - needs_reconfirming
        - not_yet_corroborated
        - not_applicable
        example: up_to_date
        type: string
      fade_stage:
        description: FadeStage is fresh, aging or stale, or null for critical and
          rescue needed reports and for rows with no still current word. The browser
          takes the worse of it and its own time stage.
        enum:
        - fresh
        - aging
        - stale
        example: fresh
        type: string
        x-nullable: true
      label:
        description: Label is the everyday word for the band, written by the server,
          empty when no word shows.
        example: Report up to date
        type: string
      recent_places:
        description: RecentPlaces is how many different spots confirmed the report
          inside the window.
        example: 3
        type: integer
      score:
        description: Score is a whole number from 0 to 100, or null while there is
          no rating (band not_yet_corroborated or not_applicable).
        example: 92
        type: integer
        x-nullable: true
      score_sentence:
        description: ScoreSentence is the popup line that explains the score, empty
          when the score is null.
        example: Score 92 out of 100.
        type: string
      sentence:
        description: Sentence is the panel line for the band, written by the server,
          empty when no word shows.
        example: 3 confirmations in the last 2 hours.
        type: string
      window_minutes:
        description: WindowMinutes is the length of the window in whole minutes.
        example: 120
        type: integer
    type: object
  handlers.CutResponse:
    properties:
      expired:
        example: false
        type: boolean
      expired_partial:
        example: false
        type: boolean
      resolved:
        example: false
        type: boolean
      resolved_partial:
        example: false
        type: boolean
    type: object
  handlers.ErrorDetail:
    properties:
      field:
        example: category
        type: string
      message:
        example: Choose a category to continue.
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handlers.ErrorDetail'
    type: object
  handlers.FactResponse:
    properties:
      detail:
        description: Detail is the muted line under the title, written by the server,
          empty when the row shows only its title.
        example: At different spots nearby.
        type: string
      kind:
        description: Kind is what the row is about.
        enum:
        - status
        - confirmations
        - disputes
        - currency
        - reporter
        example: confirmations
        type: string
      score_detail:
        description: ScoreDetail is the line that explains a score, empty when there
          is no score. Only the map popup shows it.
        example: Score 86 out of 100.
        type: string
      title:
        description: Title is the bold line of the row, written by the server.
        example: Confirmed by 2 people
        type: string
      tone:
        description: Tone picks the row's glyph. Each tone is a different shape, so
          colour is never the only cue.
        enum:
        - good
        - neutral
        - caution
        - bad
        example: good
        type: string
    type: object
  handlers.FeedReportResponse:
    properties:
      approximate:
        description: |-
          Approximate is true when the position and the geohash are a blurred
          point and the description is empty, which is how a finished Rescue
          report leaves the API (D-23).
        example: false
        type: boolean
      category:
        description: rescue_needed appears only on a report stored before 2026-10-16
          (internal/service.Categories).
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - traffic
        - rescue_needed
        - other
        example: flood
        type: string
      created_at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      description:
        example: Water rising fast near the market bridge.
        type: string
      distance_km:
        example: 1.42
        type: number
      expires_at:
        example: "2026-09-06T14:03:00.000Z"
        type: string
      geohash:
        example: tdr1qgzp
        type: string
      history:
        allOf:
        - $ref: '#/definitions/handlers.HistoryResponse'
        description: |-
          History says how a finished report ended. It is null for an active or
          a disputed report and the key is always present.
      id:
        example: 42
        type: integer
      is_own_report:
        description: |-
          IsOwnReport is true when the calling account submitted this report.
          02-05 omits the confirm/dispute controls when true (D-03) rather than
          rendering a button that will 403 — a convenience for the client,
          never the control: service.VotingService.CastVote refuses the
          self-vote server-side and 02-03b returns 403 for it regardless of
          what the client renders. Derived from a reporter account id the
          server looks up and never serialises: this response carries a
          boolean, never an account id or an email (T-01-02).
        example: false
        type: boolean
      latitude:
        example: 13.0827
        type: number
      longitude:
        example: 80.2707
        type: number
      severity:
        enum:
        - low
        - medium
        - critical
        example: critical
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is present only for shelter_open reports.
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        example: 42
        type: integer
      trust:
        allOf:
        - $ref: '#/definitions/handlers.TrustResponse'
        description: |-
          Trust is the server built trust object the vote response also carries
          for this report (D-21). It is always present, the same for every
          viewer, and never contains an identifier.
      undos_left:
        description: |-
          UndosLeft is how many take backs the calling account has left on this
          report, from 0 to 2.
        example: 2
        maximum: 2
        minimum: 0
        type: integer
      view:
        description: |-
          View is the one tab this report belongs to right now, from the
          resolver's own answer at the read's clock: active, disputed, resolved
          (closed by a resolve) or past (ran out its time). The client renders
          it and never recomputes it.
        enum:
        - active
        - disputed
        - resolved
        - past
        example: active
        type: string
      viewer_flagged:
        description: |-
          ViewerFlagged is true when the calling account has flagged this report.
          It is viewer specific like your_vote, so it never says who flagged or how
          many did, and the author's own feed always reads false unless the author
          flagged it, which the server refuses. It is filled from the one batched
          extras read, so the feed's round trips stay constant.
        example: false
        type: boolean
      visibility:
        description: |-
          Visibility is the resolver's own answer, serialised verbatim from
          service.ReportView.Visibility; the client renders it and never
          recomputes it (TRUST-02, T-02-04). "retracted" is one of the four
          values of the shared type. It never appears in the active or the
          disputed view (D-12) and appears only in the past view, where the
          report is listed as resolved (D-25).
        enum:
        - hidden
        - provisional
        - live
        - retracted
        example: live
        type: string
      visibility_reason:
        description: |-
          VisibilityReason is the resolver's own explanation for Visibility
          above, from the SAME closed slug set votes.go's CastVoteResponse.Reason
          declares, so 02-06's display-copy mapping has one contract to key off
          regardless of which endpoint delivered it.
        enum:
        - resolved
        - critical_bypasses_gates
        - disputed
        - awaiting_second_independent_confirmation
        - confirmed
        example: confirmed
        type: string
      written_at:
        description: 'Present only when the report was uploaded more than 30 minutes
          after it was written. Display only: created_at still drives the age and
          the expiry.'
        example: "2026-09-05T10:03:00.000Z"
        format: date-time
        type: string
      your_resolution:
        description: |-
          YourResolution is the calling account's own standing resolution vote on
          this report, or null. The key is always present.
        enum:
        - resolve
        - reopen
        - unresolve
        example: resolve
        type: string
      your_vote:
        description: |-
          YourVote is the calling account's own current content vote on this
          report — confirm, dispute, or null. Deliberately without omitempty,
          so the key is always present and explicitly null when the caller has
          no standing content vote. It is viewer-specific, which makes this
          response uncacheable across callers.
        enum:
        - confirm
        - dispute
        example: confirm
        type: string
    type: object
  handlers.FlagRequest:
    properties:
      reason:
        enum:
        - spam
        - abusive
        - "false"
        - dangerous
        - other
        example: spam
        type: string
    type: object
  handlers.FlagResponse:
    properties:
      flagged:
        example: true
        type: boolean
    type: object
  handlers.FocusResponse:
    properties:
      report:
        $ref: '#/definitions/handlers.FeedReportResponse'
      status:
        enum:
        - ok
        - too_old
        - unavailable
        example: ok
        type: string
    type: object
  handlers.GeocodeResponse:
    properties:
      matched_query:
        description: |-
          MatchedQuery is the shorter text that found these results when the
          whole text found nothing. It is left out when the text as typed
          matched, and when nothing matched.
        example: Banjara Hills, Hyderabad
        type: string
      results:
        items:
          $ref: '#/definitions/handlers.GeocodeResult'
        type: array
    type: object
  handlers.GeocodeResult:
    properties:
      display_name:
        example: Bengaluru, Bangalore North, Bengaluru Urban, Karnataka, India
        type: string
      lat:
        example: 12.9767936
        type: number
      lon:
        example: 77.590082
        type: number
      name:
        example: Bengaluru
        type: string
    type: object
  handlers.HistoryResponse:
    properties:
      at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      closed_by:
        enum:
        - you
        - poster
        - people
        - poster_and_people
        - you_and_people
        example: poster
        type: string
      closed_text:
        example: Resolved by the poster
        type: string
      lifetime_text:
        example: after 6 hrs
        type: string
      outcome:
        enum:
        - corroborated
        - contradicted
        - unconfirmed
        - neutral
        example: corroborated
        type: string
      outcome_label:
        example: Confirmed by 3 people nearby
        type: string
      state:
        enum:
        - resolved
        - expired
        example: resolved
        type: string
    type: object
  handlers.HomeAreaRequest:
    properties:
      lat:
        example: 12.9784
        type: number
      lon:
        example: 77.6408
        type: number
      name:
        example: Indiranagar, Bengaluru
        type: string
    type: object
  handlers.ProfileResponse:
    properties:
      display_name:
        example: Asha
        type: string
      home_area_name:
        example: Indiranagar, Bengaluru
        type: string
    type: object
  handlers.RateLimitResponse:
    properties:
      emergency_number:
        type: string
      error:
        $ref: '#/definitions/handlers.ErrorDetail'
      retry_after_seconds:
        example: 300
        type: integer
      serious:
        example: true
        type: boolean
    type: object
  handlers.RecentResponse:
    properties:
      expired_24h:
        example: 1
        type: integer
      resolved_24h:
        example: 2
        type: integer
    type: object
  handlers.ReportListResponse:
    properties:
      cut:
        allOf:
        - $ref: '#/definitions/handlers.CutResponse'
        description: Cut is present only on the past view.
      focus:
        allOf:
        - $ref: '#/definitions/handlers.FocusResponse'
        description: Focus is present only when the report parameter was sent.
      recent:
        allOf:
        - $ref: '#/definitions/handlers.RecentResponse'
        description: Recent is present only on an active, unfiltered view with no
          reports.
      reports:
        description: |-
          Reports is never null. The past view lists the resolved group first and
          then the expired group, each newest first.
        items:
          $ref: '#/definitions/handlers.FeedReportResponse'
        type: array
      view:
        description: |-
          View is the tab these reports belong to. resolved is only an alias of
          past on the way in and is answered as past.
        enum:
        - active
        - disputed
        - past
        example: active
        type: string
    type: object
  handlers.ReportResponse:
    properties:
      category:
        description: rescue_needed appears only on a report stored before 2026-10-16
          (internal/service.Categories).
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - traffic
        - rescue_needed
        - other
        example: flood
        type: string
      created_at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      description:
        example: Water rising fast near the market bridge.
        type: string
      distance_km:
        description: DistanceKm is present only in GET /api/reports responses (nil
          on the report just submitted).
        example: 1.42
        type: number
      expires_at:
        example: "2026-09-06T14:03:00.000Z"
        type: string
      geohash:
        example: tdr1qgzp
        type: string
      held:
        description: |-
          Held is true only when the text check could not finish and the report is not
          serious, so it is stored but shown in no feed or map until a background check
          finishes. A published report, borderline text included, carries false. Never omitted.
        example: false
        type: boolean
      id:
        example: 42
        type: integer
      latitude:
        example: 13.0827
        type: number
      longitude:
        example: 80.2707
        type: number
      severity:
        enum:
        - low
        - medium
        - critical
        example: critical
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is present only for shelter_open reports.
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        example: 42
        type: integer
    type: object
  handlers.ReporterResponse:
    properties:
      corroborated_reports:
        description: CorroboratedReports is how many of the judged reports were confirmed
          by people nearby.
        example: 5
        type: integer
      judged_reports:
        description: JudgedReports is how many earlier reports have a clear result.
        example: 5
        type: integer
      label:
        description: Label is the everyday word for the tag, written by the server,
          empty when no word shows.
        example: Reliable reporter
        type: string
      score:
        description: Score is a whole number from 0 to 100, or null while there is
          no rating (tag new or none).
        example: 86
        type: integer
        x-nullable: true
      score_sentence:
        description: ScoreSentence is the popup line that explains the score, empty
          when the score is null.
        example: Score 86 out of 100.
        type: string
      sentence:
        description: Sentence is the panel line for the tag, written by the server,
          empty when no word shows.
        example: 5 of their last 5 reports were confirmed.
        type: string
      tag:
        description: Tag is the reporter tag, written by the server.
        enum:
        - reliable
        - mixed
        - unreliable
        - new
        - none
        example: reliable
        type: string
    type: object
  handlers.RequestLinkRequest:
    properties:
      email:
        description: |-
          Email is the address to verify. Server-side validation (RFC 5322
          address parsing, no display-name form) happens in
          service.AuthService.RequestLink — never trust client-side validation.
        example: visitor@example.com
        type: string
    type: object
  handlers.RequestLinkResponse:
    properties:
      email:
        example: visitor@example.com
        type: string
    type: object
  handlers.SubmitReportRequest:
    properties:
      category:
        description: Category is one of the nine categories a new report can use (internal/service.PostableCategories).
          rescue_needed was retired on 2026-10-16 and is refused with 400 on the field
          category.
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - traffic
        - other
        example: flood
        type: string
      description:
        description: Description is a free text account of the report, 10 to 1000
          characters after trimming, counted as characters rather than bytes.
        example: Water rising fast near the market bridge.
        type: string
      expected_account_id:
        description: 'Optional, sent by the device queue with a saved report: the
          id, in digits, of the account the report was saved under, the same id the
          signed in page already shows. When it is present and is not the signed in
          account the post is refused with 409 on the field expected_account_id and
          nothing is stored. Leave it out for a fresh post.'
        example: "42"
        type: string
      latitude:
        description: Latitude must be between -90 and 90.
        example: 13.0827
        type: number
      longitude:
        description: Longitude must be between -180 and 180.
        example: 80.2707
        type: number
      request_id:
        description: 'Optional retry key: 16 to 64 letters, digits or hyphens. Sending
          the same key again returns the report already stored instead of storing
          it twice.'
        example: 5f0c2a9e-8d1b-4c7e-9a33-2b6f1e4d7c10
        maxLength: 64
        minLength: 16
        type: string
      severity:
        description: Severity affects triage ordering only; self-declaring critical
          never bypasses the provisional-visibility gate (internal/service.Severities).
        enum:
        - low
        - medium
        - critical
        example: medium
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is required when category is shelter_open
          and forbidden for every other category (internal/service.CapacityStatuses).
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        description: ShelterHeadcount is optional and only valid alongside category
          shelter_open.
        example: 42
        type: integer
      written_at:
        description: 'Optional, display only: when the device wrote the report, RFC
          3339. A value that cannot be read is ignored, a future one is set to the
          server time and one older than 14 days is set to 14 days before it. It never
          changes created_at, expires_at, the order or the fade.'
        example: "2026-09-05T10:03:00.000Z"
        format: date-time
        type: string
    type: object
  handlers.SubmitReportResponse:
    properties:
      report:
        $ref: '#/definitions/handlers.ReportResponse'
    type: object
  handlers.TrustResponse:
    properties:
      confirmed_places:
        description: ConfirmedPlaces is how many different spots have someone who
          confirmed the report, so several people at one spot count once (D-04).
        example: 1
        type: integer
      confirmed_sentence:
        description: ConfirmedSentence is the panel line that explains the confirmed
          count.
        example: 1 person confirmed this.
        type: string
      confirmed_text:
        description: ConfirmedText is the confirmed count as the surface shows it,
          from 0 to 99 or 99+ above 99, written by the server (A27).
        example: "1"
        type: string
      currency:
        allOf:
        - $ref: '#/definitions/handlers.CurrencyResponse'
        description: 'Currency is the still current signal: a band, the facts behind
          it (how many confirmations came from different spots recently, over what
          window) and a whole number score from 0 to 100, or null while there is no
          rating. The feed and every vote response carry the same object.'
      disputed_places:
        description: DisputedPlaces is how many different spots have someone who disputed
          the report, counted the same way.
        example: 0
        type: integer
      disputed_sentence:
        description: DisputedSentence is the panel line that explains the disputed
          count.
        example: No one has disputed this.
        type: string
      disputed_text:
        description: DisputedText is the disputed count as the surface shows it, from
          0 to 99 or 99+ above 99, written by the server (A27).
        example: "0"
        type: string
      facts:
        description: 'Facts is the ordered list of tick rows the trust card shows
          on the map popup, the feed rows and the Activity rows: what is confirmed,
          what is disputed, whether it is still current and how reliable the reporter
          is. The server writes every word. The confirmed and disputed rows are always
          there, and the others are left out when they do not apply.'
        items:
          $ref: '#/definitions/handlers.FactResponse'
        type: array
      lead_sentence:
        description: LeadSentence is the panel's first line, empty when there is none.
        example: Needs 2 people at different spots to confirm it.
        type: string
      reporter:
        allOf:
        - $ref: '#/definitions/handlers.ReporterResponse'
        description: 'Reporter is the reporter signal: a tag, the facts behind it
          (how many earlier reports had a clear result and how many of those people
          nearby confirmed) and a whole number score from 0 to 100, or null while
          there is no rating. The feed and every vote response carry the same object.'
    type: object
  handlers.UpdateProfileRequest:
    properties:
      display_name:
        example: Asha
        type: string
      home_area:
        $ref: '#/definitions/handlers.HomeAreaRequest'
    type: object
info:
  contact:
    name: Pinalert project
    url: https://github.com/swathivallabhaneni289/pinalert
  description: |-
    Crowd-reported local emergency feed for floods, cyclones, and other disasters.
    Reports are posted by nearby people and confirmed or disputed by other nearby
    people; this API is the read/write surface for that data. Reading and writing
    reports both require a session verified by email through the magic-link flow —
    an unverified caller is refused with 401. Pinalert is an unofficial,
    unaffiliated project and is not a substitute for contacting emergency services.
    This document is Swagger 2.0 — swag (the generator behind this spec) does not
    emit OpenAPI 3.x, so tooling that expects OpenAPI 3.x specifically should account
    for that; OPS-01's "OpenAPI/Swagger spec" requirement is satisfied by either
    format.
  license:
    name: Unlicensed (portfolio project, all rights reserved)
  title: Pinalert API
  version: "1.0"
paths:
  /auth/request-link:
    post:
      consumes:
      - application/json
      description: |-
        Validates the given email address, mints a single-use 5-minute magic-link
        token, persists its hash, and hands the raw link to the configured mailer.
        The response never carries a session identifier.
      parameters:
      - description: Email to verify
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.RequestLinkRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.RequestLinkResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Request a magic-link verification email
      tags:
      - auth
  /geocode:
    get:
      description: |-
        Searches Photon first, which matches close spellings and half typed words, and
        returns at most five matches, in India only. Requires a session verified by email
        through the magic-link flow. The optional lat and lon (both or neither, the report
        pin) make Photon prefer nearby places. When Photon finds nothing the search asks
        Nominatim with the whole text, preferring places near the pin, then Photon again
        without the first part and then without the second; matched_query then holds the
        shorter text that matched. A first Photon request that takes over 2 seconds is
        sent once more, with 2.5 seconds. When Photon fails, or is too slow both times,
        Nominatim alone runs those tries, in a box around the pin first. At most four upstream requests are
        sent per search. Each verified account has its own budget of 8 searches at once,
        then 1 a second; past it the answer is a 429. A
        503 means search is temporarily unavailable; report submission remains fully
        usable regardless.
      parameters:
      - description: Place or address text, 3 to 200 characters
        in: query
        name: q
        required: true
        type: string
      - description: Report pin latitude, -90 to 90, sent together with lon
        in: query
        name: lat
        type: number
      - description: Report pin longitude, -180 to 180, sent together with lat
        in: query
        name: lon
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GeocodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Search for a place or address by free-text query
      tags:
      - geocode
  /geocode/place:
    get:
      description: |-
        Place search for the history views. It runs on its own lane of the geocoder: it
        never queues ahead of a report search, repeated searches are answered from a cache, and each
        verified account has its own budget of 8 searches at once, then 1 a second. Results are in India only. It asks
        Photon first, which matches close spellings and half typed words; the optional
        lat and lon (both or neither, the map centre) make Photon prefer nearby places. When
        Photon finds nothing it asks Nominatim with the whole text, preferring places near
        the map centre, then Photon again without the first part and then without the
        second; matched_query then holds the shorter text that matched. A first Photon
        request that takes over 2 seconds is sent once more, with 2.5 seconds. When Photon
        fails, or is too slow both times, Nominatim alone runs those tries, in a box around
        the map centre first. At most four upstream requests are sent per search.
        A 429 or 503 never affects report submission, which has its own search.
      parameters:
      - description: Place text, 3 to 200 characters
        in: query
        name: q
        required: true
        type: string
      - description: Map centre latitude, -90 to 90, sent together with lon
        in: query
        name: lat
        type: number
      - description: Map centre longitude, -180 to 180, sent together with lat
        in: query
        name: lon
        type: number
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.GeocodeResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Search for a place on the reader lane
      tags:
      - geocode
