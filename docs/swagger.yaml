  /updates:
    get:
      description: |-
        Brings the signed in account's updates up to date and answers the unread count,
        capped at 99, and the latest 10 updates, newest first. The poll itself is what
        checks the reports you posted or voted on, so the bell polls this route. It takes
        no parameter and no location. Every sentence is written by the server. A report
        that was held, removed or has gone reads as an update that is no longer available,
        with no detail. The answer is never cached.
        Requires a session verified by email; an unverified caller receives 401.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.UpdatesResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 'Read the bell: the unread count and the latest updates'
      tags:
      - updates
  /updates/read:
    post:
      consumes:
      - application/json
      description: |-
        Marks the signed in account's own unread updates up to and including up_to as read.
        Send the id of the newest update shown, so an update that arrived after the list
        was drawn stays unread. It changes only your own rows. An up_to below 1 gets 400.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: The id of the newest update shown
        in: body
        name: body
