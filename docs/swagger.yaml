  /reports/{id}/timeline:
    get:
      description: |-
        Returns the history of one report as short sentences, oldest first, built only
        from the report's vote log. Every count is the number of distinct spots the trust
        block counts at that moment, the poster's own votes never count, and the history
        names no voter, no account, no place and no cell. It shows upward steps and state
        changes only (posted, confirmed, disputed, shown to everyone, marked Disputed,
        resolved, reopened, faded) plus the reader's own lines, which carry yours true.
        A report that does not exist, is too old, or is not shown to the reader gets 404.
        Requires a signed in session; otherwise 401.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      produces:
