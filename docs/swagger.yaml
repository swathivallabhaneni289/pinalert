  /reports/{id}/flag:
    post:
      consumes:
      - application/json
      description: |-
        Sends a report to the moderators with one or more of five reasons: spam, abusive,
        false, dangerous or other, each at most once, and an optional note of at most 300
        characters that only moderators see. The note goes through the same text check as a
        report description, and a refused note gets 422. The older single reason field is
        still accepted on its own as a one reason flag. A flag never hides or changes the report. Each account can flag
        a report once, and a repeat gets 409. Your own report gets 403. A report that does
        not exist, or that is not shown in any feed, gets 404. Flagging is limited per
        verified account, and a blocked flag gets 429 with a Retry-After header.
        Requires a session verified by email; an unverified caller receives 401.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: One or more of the five reasons and an optional note
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.FlagRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.FlagResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
