          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: The note was refused by the text check
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
