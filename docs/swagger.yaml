  /reports:
    get:
      description: |-
        Runs the indexed bounding-box prefilter followed by exact Haversine distance,
        then resolves each report fresh via the shared resolver. This single endpoint serves
        the map, the list, the Past tab, the counts for an empty Active tab and a report link;
        there is no separate route per tab.
        The view parameter picks the tab. active (the default) is Live and Provisional reports,
        nearest first. disputed is only reports currently hidden by disputes, replacing the
        default view rather than adding to it; a critical or rescue-needed report stays Live
        however heavily it is disputed, so it appears only in the active view. past is what was
        resolved and what ran out its time in the last seven days, the resolved group first and
        then the expired group, each newest first and cut at 25 with the cut object saying so.
        resolved is accepted as a read only alias of past and answered as past. A resolved
        (retracted) report is never returned by the active or the disputed view; it is listed
        only in the past view, and no past entry changes an active count.
        show_disputed=true still selects the disputed view so old links keep working; sent with
        another view it is refused with 400 on the field view.
        The category parameter keeps one report category in the chosen view and is refused with
        400 when it is not one of the ten known categories. rescue_needed is still accepted here
        so reports stored before 2026-10-16 can be found.
        The report parameter is a report id from a link. When it is sent the focus object answers
        it: ok with that report even when it lies outside the radius and outside the seven day
        window, too_old when it ended more than seven days ago, or unavailable when there is no such
        report or no tab lists it. Not found and every unlisted state share the one unavailable
        answer. The reports array still holds the reader's own area.
        recent ({resolved_24h, expired_24h}) is present only when the view is active, no category
        was sent and there are no reports, so an empty tab can say what happened lately.
        A finished Rescue report never leaves the API exact on the past view or on a link: its
        description is empty, its latitude, longitude and geohash are a blurred point,
        approximate is true and distance_km is measured to that point. A live Rescue report and
        finished Flood, Shelter and Power reports stay exact.
        Every report carries your_vote, your_resolution, undos_left and is_own_report relative to
        the calling verified account. Requires a session verified by email through the
        magic-link flow; an unverified caller receives 401 and no report data.
        Every report also carries a trust object: how many people at different nearby spots confirmed and disputed it, counted once per spot and not once per vote.
        lat, lon and radius_km must be finite numbers; NaN is refused with 400 and the name of the parameter.
      parameters:
      - description: Latitude of the query center (required, -90 to 90)
        in: query
        name: lat
        required: true
        type: number
      - description: Longitude of the query center (required, -180 to 180)
        in: query
        name: lon
        required: true
        type: number
      - default: 10
        description: Search radius in kilometers (defaults to 10, bounded to 0.1-50)
        in: query
        maximum: 50
        minimum: 0.1
        name: radius_km
        type: number
      - description: 'Which tab to list: active (the default), disputed or past. resolved
          is an alias of past.'
        enum:
        - active
        - disputed
        - past
        - resolved
        in: query
        name: view
        type: string
      - description: Older way to select the disputed view. true selects disputed;
          with another view it is refused (defaults to false)
        in: query
        name: show_disputed
        type: boolean
      - description: 'Keep only this report category in the chosen view (default:
          all)'
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - traffic
        - rescue_needed
        - other
        in: query
        name: category
        type: string
      - description: A report id from a link; answered in the focus object
        in: query
        minimum: 1
        name: report
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.ReportListResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: 'List the reports near a point for one view: active, disputed or past'
      tags:
      - reports
    post:
      consumes:
      - application/json
      description: |-
        Creates a location-tagged report under the caller's session. Requires a session
        verified by email through the magic-link flow (POST /auth/request-link, then
        GET /auth/verify) — an unverified caller receives 401. id, geohash, created_at
        and expires_at are computed server-side and can never be set by the client.
        The description is checked before anything is stored. Text that looks hateful, like harassment, sexual, or like random characters is refused with 422 naming the problem, and nothing is stored.
        When the check cannot finish in time, a critical report is published at once and checked again in the background; any other report is stored but held off every feed until a background check finishes, and held is true.
        Posting is limited per verified account, with separate allowances for serious reports (critical) and for every other report.
        A blocked post gets 429 with a Retry-After header and stores nothing, and a rejected or failed post does not use the allowance.
        An optional request_id makes a retry safe: a repeated key answers 200 with the stored report and is checked before any limit or text check.
        An optional written_at is display only and never changes created_at or expires_at.
        An optional expected_account_id, sent by the device queue with a saved report, names the account the report was saved under. When it is not the signed in account the post gets 409 on the field expected_account_id before any other check, stores nothing and uses no allowance; the answer names neither account. A post without it is not checked.
        The category rescue_needed is no longer accepted for a new report and is refused with 400 on the field category. Reports already stored with it keep their rules and still appear in GET /api/reports.
      parameters:
      - description: Report to submit
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.SubmitReportRequest'
      produces:
      - application/json
      responses:
        "200":
          description: 'This retry key was already used: the stored report, nothing
            stored again'
          schema:
            $ref: '#/definitions/handlers.SubmitReportResponse'
        "201":
          description: Created
          schema:
            $ref: '#/definitions/handlers.SubmitReportResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: expected_account_id is not the signed in account; nothing was
            stored
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "422":
          description: The text check refused the description; nothing was stored
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Submit a new emergency report
      tags:
      - reports
  /reports/{id}/confirm:
    post:
      consumes:
      - application/json
      description: |-
        Casts one of five votes against a report: confirm/dispute are content votes (is
        this report still true), resolve/reopen/unresolve are resolution votes (is this
        resolved). Unresolve is the take back of the caller's own earlier resolve: it needs
        no location, it never counts as a reopen, and it is refused with 409 when the caller
        has no standing resolve on the report. The poster's reopen and every take back share
        one limit of two per report; past it the answer is 409. A non poster's reopen is an
        ordinary claim and is never limited.
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401. The reporter receives 403 on confirm/dispute but may resolve
        or reopen their own report instantly. The response carries the freshly recomputed
        visibility and reason so the client can render the outcome without guessing.
        A voter more than 1 km from the report (service.MaxVoteDistanceKm) gets 403 whose
        error field is location, on confirm, dispute, resolve and reopen, with one fixed
        sentence that never carries the distance. The reporter's own resolve and reopen
        are exempt, and so is the take back.
        The response also carries the same trust object GET /reports returns for this report.
        Resolve, reopen and unresolve responses also carry undos_left, the number of take
        backs the caller has left on this report; confirm and dispute responses do not.
        A location is required on every vote except the reporter's own resolve and reopen
        and the take back.
        A body with no latitude and no longitude is 400 with error field latitude, and a body
        with only one of the two is 400 naming the missing one.
        A vote that comes too fast gets 429 with a Retry-After header.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: Voter's current coordinates
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/handlers.CastVoteRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/handlers.CastVoteResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
        "429":
          description: Blocked by a limit, see Retry-After
          headers:
            Retry-After:
              description: Whole seconds to wait before trying again
              type: integer
          schema:
            $ref: '#/definitions/handlers.RateLimitResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/handlers.ErrorResponse'
      summary: Cast a confirm, dispute, resolve, reopen or unresolve vote on a report
      tags:
      - reports
