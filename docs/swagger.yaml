basePath: /api
definitions:
  handlers.AlertSettingsRequest:
    properties:
      alert_radius_km:
        example: 5
        type: integer
      changes_push:
        example: false
        type: boolean
      critical_push:
        example: true
        type: boolean
      official_push:
        example: true
        type: boolean
      reliable_alerts:
        example: true
        type: boolean
    type: object
  handlers.AlertSettingsResponse:
    properties:
      alert_radius_km:
        example: 5
        type: integer
      changes_push:
        example: false
        type: boolean
      critical_push:
        example: true
        type: boolean
      has_home_area:
        example: true
        type: boolean
      official_push:
        example: true
        type: boolean
      reliable_alerts:
        example: true
        type: boolean
    type: object
  handlers.BlockedPeopleResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/handlers.PersonEntryResponse'
        type: array
    type: object
  handlers.CastVoteRequest:
    properties:
      latitude:
        description: Latitude must be between -90 and 90. Required, except on the
          reporter's own resolve and reopen and on the take back.
        example: 13.0827
        type: number
      longitude:
        description: Longitude must be between -180 and 180. Required, except on the
          reporter's own resolve and reopen and on the take back.
        example: 80.2707
        type: number
    type: object
  handlers.CastVoteResponse:
    properties:
      rate_prompt:
        allOf:
        - $ref: '#/definitions/handlers.RatePromptResponse'
        description: |-
          RatePrompt is present only after Yes, mark resolved, when you may rate this
          reporter and have not yet. It names a reporter whose profile you may open
          and nothing else; the browser shows the skippable star box from it and
          decides nothing about who may rate.
      reason:
        enum:
        - resolved
        - critical_bypasses_gates
        - disputed
        - awaiting_second_independent_confirmation
        - confirmed
        example: confirmed
        type: string
      trust:
        allOf:
        - $ref: '#/definitions/handlers.TrustResponse'
        description: |-
          Trust is the server built trust object for this report, the same value
          the feed returns (D-21). It is present on every successful vote.
      undos_left:
        description: |-
          UndosLeft is how many take backs the caller has left on this report after
          this vote (D-22). It is present on resolve, reopen and unresolve
          responses only, and absent on confirm and dispute, which have no undo
          budget. The browser decides the short Undo after Yes, mark resolved from
          this number before the list refetch lands.
        example: 2
        type: integer
      visibility:
        enum:
        - hidden
        - provisional
        - live
        - retracted
        example: live
        type: string
    type: object
  handlers.CodeRequest:
    properties:
      code:
        example: "482913"
        type: string
    type: object
  handlers.CodeSentResponse:
    properties:
      sent:
        example: true
        type: boolean
    type: object
  handlers.CommentListResponse:
    properties:
      comment_count:
        example: 12
        type: integer
      comments:
        items:
          $ref: '#/definitions/handlers.CommentResponse'
        type: array
      comments_open:
        example: true
        type: boolean
      more:
        example: false
        type: boolean
      next_after:
        example: 0
        type: integer
    type: object
  handlers.CommentResponse:
    properties:
      at:
        example: "2026-10-29T10:15:00Z"
        type: string
      author:
        example: asha_k
        type: string
      author_kind:
        enum:
        - user
        - new_member
        - deleted_account
        example: user
        type: string
      can_delete:
        example: false
        type: boolean
      deleted:
        example: false
        type: boolean
      held:
        example: false
        type: boolean
      hidden:
        description: true when you blocked the author and others replied
        example: false
        type: boolean
      id:
        example: 41
        type: integer
      is_own:
        example: false
        type: boolean
      is_reporter:
        example: false
        type: boolean
      likes:
        example: 3
        type: integer
      removed:
        example: false
        type: boolean
      replies:
        items:
          $ref: '#/definitions/handlers.CommentResponse'
        type: array
      reply_count:
        example: 1
        type: integer
      reply_to_author:
        example: ravi_m
        type: string
      viewer_flagged:
        example: false
        type: boolean
      viewer_liked:
        example: false
        type: boolean
      words:
        example: The road is open again from the north side.
        type: string
    type: object
  handlers.CurrencyResponse:
    properties:
      band:
        description: Band is the still current band, written by the server.
        enum:
        - up_to_date
        - getting_old
        - needs_reconfirming
        - not_yet_corroborated
        - not_applicable
        example: up_to_date
        type: string
      fade_stage:
        description: FadeStage is fresh, aging or stale, or null for critical and
          rescue needed reports and for rows with no still current word. The browser
          takes the worse of it and its own time stage.
        enum:
        - fresh
        - aging
        - stale
        example: fresh
        type: string
        x-nullable: true
      label:
        description: Label is the everyday word for the band, written by the server,
          empty when no word shows.
        example: Report up to date
        type: string
      recent_places:
        description: RecentPlaces is how many different spots confirmed the report
          inside the window.
        example: 3
        type: integer
      score:
        description: Score is a whole number from 0 to 100, or null while there is
          no rating (band not_yet_corroborated or not_applicable).
        example: 92
        type: integer
        x-nullable: true
      score_sentence:
        description: ScoreSentence is the popup line that explains the score, empty
          when the score is null.
        example: Score 92 out of 100.
        type: string
      sentence:
        description: Sentence is the panel line for the band, written by the server,
          empty when no word shows.
        example: 3 confirmations in the last 2 hours.
        type: string
      window_minutes:
        description: WindowMinutes is the length of the window in whole minutes.
        example: 120
        type: integer
    type: object
  handlers.CutResponse:
    properties:
      expired:
        example: false
        type: boolean
      expired_partial:
        example: false
        type: boolean
      resolved:
        example: false
        type: boolean
      resolved_partial:
        example: false
        type: boolean
    type: object
  handlers.DeleteAccountRequest:
    properties:
      confirm:
        example: true
        type: boolean
    type: object
  handlers.DeleteCommentResponse:
    properties:
      deleted:
        example: true
        type: boolean
    type: object
  handlers.ErrorDetail:
    properties:
      field:
        example: category
        type: string
      message:
        example: Choose a category to continue.
        type: string
    type: object
  handlers.ErrorResponse:
    properties:
      error:
        $ref: '#/definitions/handlers.ErrorDetail'
    type: object
  handlers.FactResponse:
    properties:
      detail:
        description: Detail is the muted line under the title, written by the server,
          empty when the row shows only its title.
        example: At different spots nearby.
        type: string
      kind:
        description: Kind is what the row is about.
        enum:
        - status
        - confirmations
        - disputes
        - currency
        - reporter
        example: confirmations
        type: string
      score_detail:
        description: ScoreDetail is the line that explains a score, empty when there
          is no score. Only the map popup shows it.
        example: Score 86 out of 100.
        type: string
      title:
        description: Title is the bold line of the row, written by the server.
        example: Confirmed by 2 people
        type: string
      tone:
        description: Tone picks the row's glyph. Each tone is a different shape, so
          colour is never the only cue.
        enum:
        - good
        - neutral
        - caution
        - bad
        example: good
        type: string
    type: object
  handlers.FeedReportResponse:
    properties:
      approximate:
        description: |-
          Approximate is true when the position and the geohash are a blurred
          point and the description is empty, which is how a finished Rescue
          report leaves the API (D-23).
        example: false
        type: boolean
      category:
        description: rescue_needed appears only on a report stored before 2026-10-16
          (internal/service.Categories).
        enum:
        - flood
        - earthquake
        - fire
        - storm_cyclone
        - road_blocked
        - power_outage
        - shelter_open
        - traffic
        - rescue_needed
        - other
        example: flood
        type: string
      comment_count:
        description: |-
          CommentCount is the number of comments everyone can see on this report, a
          reply included. A comment still held for a check or deleted is not counted,
          so every reader gets the same number. It is filled from the one batched
          extras read, so the feed's round trips stay constant. Always present.
        example: 3
        type: integer
      comments_open:
        description: |-
          CommentsOpen is the server's word on whether people may still comment,
          reply and like on this report: true while it is active or disputed, false
          once it is resolved, faded or taken down. The client never decides it.
          Always present.
        example: true
        type: boolean
      confirmed_by_people:
        description: |-
          ConfirmedByPeople is the server authored Show Confirmed membership: true only
          for an active report that people at different nearby spots have confirmed
          (and whose disputes are not a majority). It is not the same as visibility
          live: a Critical report is shown at once but is confirmed only once people
          confirm it. The client renders it and never recomputes it (TRUST-02). Always
          present.
        example: true
        type: boolean
      created_at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      description:
        example: Water rising fast near the market bridge.
        type: string
      distance_km:
        example: 1.42
        type: number
      expires_at:
        example: "2026-09-06T14:03:00.000Z"
        type: string
      geohash:
        example: tdr1qgzp
        type: string
      history:
        allOf:
        - $ref: '#/definitions/handlers.HistoryResponse'
        description: |-
          History says how a finished report ended. It is null for an active or
          a disputed report and the key is always present.
      id:
        example: 42
        type: integer
      is_own_report:
        description: |-
          IsOwnReport is true when the calling account submitted this report.
          02-05 omits the confirm/dispute controls when true (D-03) rather than
          rendering a button that will 403 — a convenience for the client,
          never the control: service.VotingService.CastVote refuses the
          self-vote server-side and 02-03b returns 403 for it regardless of
          what the client renders. Derived from a reporter account id the
          server looks up and never serialises: this response carries a
          boolean, never an account id or an email (T-01-02).
        example: false
        type: boolean
      kept_by_reliable_filter:
        description: |-
          KeptByReliableFilter is the server authored membership of the opt in Only
          Reliable reporters tick: true when the reporter's tag is Reliable reporter
          or the report is serious (critical, or Rescue needed stored before that
          category was retired). Only the reader's own tick reads it. It never
          filters, hides or reorders anything by default. Always present.
        example: false
        type: boolean
      latitude:
        example: 13.0827
        type: number
      longitude:
        example: 80.2707
        type: number
      reporter_profile_path:
        description: |-
          ReporterProfilePath is the path of the reporter's public profile. It is
          present only for an opted in reporter who has not blocked you, never for
          your own report, and only while the report is active or disputed. It sits
          on the row beside is_own_report and never inside trust, so the feed and the
          vote response still build equal trust objects. Omitted when absent.
        example: /u/ravi.k
        type: string
      severity:
        enum:
        - low
        - medium
        - critical
        example: critical
        type: string
      shelter_capacity_status:
        description: ShelterCapacityStatus is present only for shelter_open reports.
        enum:
        - available
        - limited
        - full
        - closed
        example: available
        type: string
      shelter_headcount:
        example: 42
        type: integer
      trust:
        allOf:
        - $ref: '#/definitions/handlers.TrustResponse'
        description: |-
          Trust is the server built trust object the vote response also carries
          for this report (D-21). It is always present, the same for every
          viewer, and never contains an identifier.
      undos_left:
        description: |-
          UndosLeft is how many take backs the calling account has left on this
          report, from 0 to 2.
        example: 2
        maximum: 2
        minimum: 0
        type: integer
      view:
        description: |-
          View is the one tab this report belongs to right now, from the
          resolver's own answer at the read's clock: active, disputed, resolved
          (closed by a resolve) or past (ran out its time). The client renders
          it and never recomputes it.
        enum:
        - active
        - disputed
        - resolved
        - past
        example: active
        type: string
      viewer_flagged:
        description: |-
          ViewerFlagged is true when the calling account has flagged this report.
          It is viewer specific like your_vote, so it never says who flagged or how
          many did, and the author's own feed always reads false unless the author
          flagged it, which the server refuses. It is filled from the one batched
          extras read, so the feed's round trips stay constant.
        example: false
        type: boolean
      viewer_follows:
        description: |-
          ViewerFollows is true when the calling account posted this report or voted
          on it in any way (confirm, dispute, resolve, reopen or unresolve) or has a
          clear comment on it. It is
          viewer specific like your_vote, so it never says who else follows or how
          many do. It is computed from the vote rows the read already holds, so the
          feed's round trips stay constant. Always present.
        example: true
        type: boolean
      viewer_muted:
        description: |-
          ViewerMuted is true when the calling account turned updates off for this
          report. It is viewer specific, never says who else muted, and is filled
          from the one batched extras read. Always present.
        example: false
        type: boolean
      visibility:
        description: |-
          Visibility is the resolver's own answer, serialised verbatim from
          service.ReportView.Visibility; the client renders it and never
          recomputes it (TRUST-02, T-02-04). "retracted" is one of the four
          values of the shared type. It never appears in the active or the
          disputed view (D-12) and appears only in the past view, where the
          report is listed as resolved (D-25).
        enum:
        - hidden
        - provisional
        - live
        - retracted
        example: live
        type: string
      visibility_reason:
        description: |-
          VisibilityReason is the resolver's own explanation for Visibility
          above, from the SAME closed slug set votes.go's CastVoteResponse.Reason
          declares, so 02-06's display-copy mapping has one contract to key off
          regardless of which endpoint delivered it.
        enum:
        - resolved
        - critical_bypasses_gates
        - disputed
        - awaiting_second_independent_confirmation
        - confirmed
        example: confirmed
        type: string
      written_at:
        description: 'Present only when the report was uploaded more than 30 minutes
          after it was written. Display only: created_at still drives the age and
          the expiry.'
        example: "2026-09-05T10:03:00.000Z"
        format: date-time
        type: string
      your_resolution:
        description: |-
          YourResolution is the calling account's own standing resolution vote on
          this report, or null. The key is always present.
        enum:
        - resolve
        - reopen
        - unresolve
        example: resolve
        type: string
      your_vote:
        description: |-
          YourVote is the calling account's own current content vote on this
          report — confirm, dispute, or null. Deliberately without omitempty,
          so the key is always present and explicitly null when the caller has
          no standing content vote. It is viewer-specific, which makes this
          response uncacheable across callers.
        enum:
        - confirm
        - dispute
        example: confirm
        type: string
    type: object
  handlers.FlagRequest:
    properties:
      note:
        example: The photo is from a flood in 2019.
        maxLength: 300
        type: string
      reason:
        enum:
        - spam
        - abusive
        - "false"
        - dangerous
        - other
        example: spam
        type: string
      reasons:
        example:
        - spam
        - "false"
        items:
          enum:
          - spam
          - abusive
          - "false"
          - dangerous
          - other
          type: string
        type: array
    type: object
  handlers.FlagResponse:
    properties:
      flagged:
        example: true
        type: boolean
    type: object
  handlers.FocusResponse:
    properties:
      report:
        $ref: '#/definitions/handlers.FeedReportResponse'
      status:
        enum:
        - ok
        - too_old
        - unavailable
        example: ok
        type: string
    type: object
  handlers.GeocodeResponse:
    properties:
      matched_query:
        description: |-
          MatchedQuery is the shorter text that found these results when the
          whole text found nothing. It is left out when the text as typed
          matched, and when nothing matched.
        example: Banjara Hills, Hyderabad
        type: string
      results:
        items:
          $ref: '#/definitions/handlers.GeocodeResult'
        type: array
    type: object
  handlers.GeocodeResult:
    properties:
      area:
        description: |-
          Area is the area the place lies in: its own name when it is an area, else
          its locality, district or city. Left out when none is known. The first
          time flow uses it to prefill the home area from a picked street.
        example: Indiranagar
        type: string
      display_name:
        example: Bengaluru, Bangalore North, Bengaluru Urban, Karnataka, India
        type: string
      lat:
        example: 12.9767936
        type: number
      lon:
        example: 77.590082
        type: number
      name:
        example: Bengaluru
        type: string
      town:
        example: Vijayawada
        type: string
      typed:
        description: |-
          Typed is true on the one row of a kind=area place search that is the
          person's own typed text, offered when OpenStreetMap holds no area by that
          name in the town they typed. Its name is the text to save, display_name
          and town are the town it was placed in, and lat and lon are a point in
          that town. Left out on every other row.
        example: true
        type: boolean
    type: object
  handlers.HistoryResponse:
    properties:
      at:
        example: "2026-09-05T14:03:00.000Z"
        type: string
      closed_by:
        enum:
        - you
        - poster
        - people
        - poster_and_people
        - you_and_people
        example: poster
        type: string
      closed_text:
        example: Resolved by the poster
        type: string
      lifetime_text:
        example: after 6 hrs
        type: string
      outcome:
        enum:
        - corroborated
        - contradicted
        - unconfirmed
        - neutral
        example: corroborated
        type: string
      outcome_label:
        example: Confirmed by 3 people nearby
        type: string
      state:
        enum:
        - resolved
        - expired
        example: resolved
        type: string
    type: object
  handlers.HomeAreaRequest:
    properties:
      lat:
        example: 12.9784
        type: number
      lon:
        example: 77.6408
        type: number
      name:
        example: Indiranagar, Bengaluru
        type: string
    type: object
  handlers.LikeResponse:
    properties:
      likes:
        example: 4
        type: integer
      viewer_liked:
        example: true
        type: boolean
    type: object
  handlers.MarkReadRequest:
    properties:
      up_to:
        example: 41
        type: integer
    type: object
  handlers.MutedPeopleResponse:
    properties:
      entries:
        items:
          $ref: '#/definitions/handlers.PersonEntryResponse'
        type: array
    type: object
  handlers.MutedReportWire:
    properties:
      available:
        example: true
        type: boolean
      category:
        example: Flood
        type: string
      muted_at:
        type: string
      report_id:
        example: 17
        type: integer
      severity:
        example: Critical
        type: string
      severity_level:
        enum:
        - low
        - medium
        - critical
        - ''''''
        example: critical
        type: string
      text:
        example: Water over the bridge
        type: string
    type: object
  handlers.MutedReportsResponse:
    properties:
      reports:
        items:
          $ref: '#/definitions/handlers.MutedReportWire'
        type: array
    type: object
  handlers.NotifyRequest:
    properties:
      "on":
        example: true
        type: boolean
    type: object
  handlers.NotifyResponse:
    properties:
      notify:
        example: true
        type: boolean
    type: object
  handlers.OfficialAlertsResponse:
    properties:
      age_seconds:
        description: |-
          AgeSeconds is the time since the last good check by the server clock.
          Null when the feed was never checked.
        example: 240
        type: integer
        x-nullable: true
      area_known:
        description: |-
          AreaKnown is false when the request carried no usable position and the
          account has no home area; groups is then empty and that is not an
          answer of "no alerts".
        example: true
        type: boolean
      banner:
        allOf:
        - $ref: '#/definitions/handlers.OfficialBannerResponse'
        description: |-
          Banner is the Nearby banner pick, or null. Only for a fresh answer and
          the reader's own area.
        x-nullable: true
      count:
        description: Count is the number of rows across all groups; a grouped row
          counts once.
        example: 3
        type: integer
      districts_line:
        description: |-
          DistrictsLine names the districts the page covers, for example
          "Krishna, NTR, Guntur and 4 more".
        example: Krishna district
        type: string
      groups:
        description: |-
          Groups are drawn in this order: reader, home, state, unplaced. A group
          with no rows is left out. Empty when the state is unavailable.
        items:
          $ref: '#/definitions/handlers.OfficialGroupResponse'
        type: array
      hazards_age_seconds:
        description: |-
          HazardsAgeSeconds is the time since the last good GDACS check. Null when it
          was never checked.
        example: 600
        type: integer
        x-nullable: true
      hazards_last_success_at:
        description: |-
          HazardsLastSuccessAt is the time of the last good GDACS check. Null when
          never checked.
        example: "2026-10-29T06:20:00Z"
        type: string
        x-nullable: true
      hazards_state:
        description: |-
          HazardsState is the same fresh, stale or unavailable word for the GDACS
          feed, which is checked on its own schedule (plan 05-21). GDACS rows are
          listed only while it is fresh.
        enum:
        - fresh
        - stale
        - unavailable
        example: fresh
        type: string
      last_success_at:
        description: LastSuccessAt is the time of the last good check. Null when never
          checked.
        example: "2026-10-29T06:25:00Z"
        type: string
        x-nullable: true
      state:
        description: |-
          State is fresh (last good check within 30 minutes), stale (up to 6 hours)
          or unavailable (never checked, or over 6 hours).
        enum:
        - fresh
        - stale
        - unavailable
        example: fresh
        type: string
    type: object
  handlers.OfficialBannerResponse:
    properties:
      alert_id:
        example: 41
        type: integer
      area:
        example: Krishna district
        type: string
      demo:
        description: |-
          Demo is true on the Demo's sample alert (plan 05-19) and false on every
          real one. The banner then draws the Demo tag.
        example: false
        type: boolean
      event_phrase:
        example: Cyclone warning
        type: string
      level:
        enum:
        - severe
        - extreme
        example: extreme
        type: string
      level_word:
        example: Extreme
        type: string
      more:
        description: More is how many other eligible rows there are.
        example: 2
        type: integer
    type: object
  handlers.OfficialDetailsResponse:
    properties:
      areas:
        type: string
      description:
        type: string
      instruction:
        type: string
      original_description:
        type: string
      original_headline:
        type: string
      original_lang_code:
        example: te
        type: string
      original_lang_label:
        description: |-
          OriginalLangLabel is a language name such as Telugu, or the feed's own
          label when it is not known. OriginalLangCode is a BCP 47 code only for
          the known ones, else empty.
        example: Telugu
        type: string
      source_line:
        example: NDMA SACHET
        type: string
    type: object
  handlers.OfficialGroupResponse:
    properties:
      kind:
        enum:
        - reader
        - home
        - state
        - unplaced
        example: reader
        type: string
      label:
        example: 'Where you are: Krishna district'
        type: string
      rows:
        items:
          $ref: '#/definitions/handlers.OfficialRowResponse'
        type: array
    type: object
  handlers.OfficialPinResponse:
    properties:
      alert_level:
        description: |-
          AlertLevel is red, orange or green. LevelWord is the same as Red, Orange or
          Green.
        enum:
        - red
        - orange
        - green
        example: red
        type: string
      event_type:
