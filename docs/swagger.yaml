      summary: Cast a confirm, dispute, resolve, reopen or unresolve vote on a report
      tags:
      - reports
  /reports/{id}/unresolve:
    post:
      consumes:
      - application/json
      description: |-
        Casts one of five votes against a report: confirm/dispute are content votes (is
        this report still true), resolve/reopen/unresolve are resolution votes (is this
        resolved). Unresolve is the take back of the caller's own earlier resolve: it needs
        no location, it never counts as a reopen, and it is refused with 409 when the caller
        has no standing resolve on the report. The poster's reopen and every take back share
        one limit of two per report; past it the answer is 409. A non poster's reopen is an
        ordinary claim and is never limited.
        Requires a session verified by email through the magic-link flow; an unverified
        caller receives 401. The reporter receives 403 on confirm/dispute but may resolve
        or reopen their own report instantly. The response carries the freshly recomputed
        visibility and reason so the client can render the outcome without guessing.
        A voter more than 1 km from the report (service.MaxVoteDistanceKm) gets 403 whose
        error field is location, on confirm, dispute, resolve and reopen, with one fixed
        sentence that never carries the distance. The reporter's own resolve and reopen
        are exempt, and so is the take back.
        The response also carries the same trust object GET /reports returns for this report.
        Resolve, reopen and unresolve responses also carry undos_left, the number of take
        backs the caller has left on this report; confirm and dispute responses do not.
        A location is required on every vote except the reporter's own resolve and reopen
        and the take back.
        A body with no latitude and no longitude is 400 with error field latitude, and a body
        with only one of the two is 400 naming the missing one.
        A vote that comes too fast gets 429 with a Retry-After header.
      parameters:
      - description: Report id
        in: path
        name: id
        required: true
        type: integer
      - description: Voter's current coordinates
        in: body
        name: body
        required: true
        schema:
